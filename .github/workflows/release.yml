name: Build & Automated Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
          cache: true
          cache-dependency-path: RhythmHub.csproj

      - name: Install Inno Setup Compiler
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build Application & Compile Installer
        shell: powershell
        run: |
          .\build-and-publish.ps1

      - name: Verify Setup Executable Output
        shell: powershell
        run: |
          $setupPath = "dist\installer\RhythmHubSetup.exe"
          if (-not (Test-Path $setupPath)) {
            Write-Error "Installer executable not found at $setupPath!"
            exit 1
          }
          Write-Host "Verified installer executable exists at $setupPath" -ForegroundColor Green

      - name: Create GitHub Release & Upload Setup Executable
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "master" -or $tag -eq "main") {
            $tag = "v1.0.0"
          }

          Write-Host "Creating/Updating GitHub Release for tag: $tag..." -ForegroundColor Green

          # Use GitHub CLI (gh) to create release, auto-generate notes, and attach installer
          gh release create $tag "dist\installer\RhythmHubSetup.exe#RhythmHubSetup.exe" --title "RhythmHub $tag" --generate-notes --clobber
