name: Build & Automated Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
          cache: true
          cache-dependency-path: RhythmHub.csproj

      - name: Install Inno Setup Compiler
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Build Application & Compile Installer
        shell: powershell
        run: |
          .\build-and-publish.ps1

      - name: Verify Setup Executable Output
        shell: powershell
        run: |
          $setupPath = "dist\installer\RhythmHubSetup.exe"
          if (-not (Test-Path $setupPath)) {
            Write-Error "Installer executable not found at $setupPath!"
            exit 1
          }
          Write-Host "Verified installer executable exists at $setupPath" -ForegroundColor Green

      - name: Create GitHub Release & Upload Setup Executable
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/installer/RhythmHubSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
